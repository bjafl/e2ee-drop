services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    restart: "no"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@e2ee-drop/db", "migrate:deploy"]
    environment:
      # Compose-internal Postgres URL, built from the separate POSTGRES_* vars.
      # Do NOT use ${DATABASE_URL} here: that's the host-facing value in .env,
      # meant for host-side tooling (pnpm dev, tests), and its hostname won't
      # resolve from inside the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Compose-internal Postgres URL — see the comment on migrate's DATABASE_URL above.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${PORT}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      LINK_EXPIRY_HOURS: ${LINK_EXPIRY_HOURS}
      DROP_RETENTION_DAYS_DEFAULT: ${DROP_RETENTION_DAYS_DEFAULT}
      DROP_RETENTION_DAYS_MAX: ${DROP_RETENTION_DAYS_MAX}
      CODEWORD_WORD_COUNT: ${CODEWORD_WORD_COUNT}
      # Compose-internal MinIO S3 API endpoint (the minio container's own listen
      # port; 9001 is only the admin console). Do NOT use ${MINIO_ENDPOINT} here,
      # same reasoning as DATABASE_URL above.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${WEB_PORT:-8080}/s3}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES}
      APP_URL: ${APP_URL}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  cleanup:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@e2ee-drop/api", "cleanup"]
    environment:
      # Compose-internal Postgres URL — see the comment on migrate's DATABASE_URL above.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DROP_RETENTION_DAYS_DEFAULT: ${DROP_RETENTION_DAYS_DEFAULT}
      DROP_RETENTION_DAYS_MAX: ${DROP_RETENTION_DAYS_MAX}
      # Compose-internal MinIO S3 API endpoint — see the comment on api's MINIO_ENDPOINT above.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # expose, not ports: publishing a host port here collides with
    # coolify-proxy (Traefik), which permanently binds 0.0.0.0:8080 on this
    # host for its own dashboard/API (see commit 52a2450). Coolify routes to
    # this service over the internal Docker network via the SERVICE_FQDN_WEB
    # label, so a host-published port was never needed for real deployment —
    # only for the local `pnpm verify:e2e` scenario, which needs its own
    # docker-compose.override.yml (see README) rather than a port bind here.
    expose:
      - "80"
    depends_on:
      - api
      - minio

volumes:
  postgres-data:
  minio-data:
