server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security response headers -------------------------------------------
  # Declared at server level so every location inherits them. nginx caveat:
  # add_header is inherited from the enclosing level ONLY if the location
  # itself declares no add_header at all; a single add_header inside a
  # location silently drops all of these for that location. The /s3/ block
  # below therefore repeats its own full set. If you ever add an add_header to
  # any other location, repeat all of these there too. `always` makes them
  # apply to error responses (4xx/5xx) as well, not just 2xx/3xx.
  #
  # CSP: the app is entirely same-origin (Vite-bundled JS/CSS/fonts, API and
  # SSE at /api/, presigned storage URLs at /s3/), with no inline <script>
  # or <style> in the built index.html, so everything is locked to 'self'.
  # 'wasm-unsafe-eval' is required and narrow: hash-wasm (Argon2id key
  # derivation at login/registration, lib/keyWrapping.ts) compiles
  # WebAssembly, which CSP otherwise blocks; it does NOT allow JS eval().
  # connect-src also governs EventSource (the /api/links/:slug/events SSE
  # stream) and fetch() of presigned /s3/ URLs. If you point
  # MINIO_PUBLIC_ENDPOINT at a different origin than this one, add that
  # origin to connect-src or uploads/downloads will be blocked.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Legacy clickjacking protection for browsers predating CSP frame-ancestors.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  # Nothing here ever links to a third party, and link paths carry slugs, so
  # never send a Referer off-origin. (Not no-referrer: that would also make
  # browsers send `Origin: null` on same-origin POSTs.)
  add_header Referrer-Policy "same-origin" always;
  # Browsers ignore HSTS received over plain HTTP (RFC 6797 section 8.1), so
  # this is inert on the default http://localhost:8080 setup and only takes
  # effect once a TLS-terminating proxy serves the app over HTTPS. 180 days,
  # deliberately without includeSubDomains/preload: those commit the whole
  # domain and are for the operator to opt into, not this default.
  add_header Strict-Transport-Security "max-age=15552000" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    # Without these, the API only ever sees nginx's own container address as
    # the connecting IP, not the real client's — collapsing every client
    # behind this proxy into a single bucket for anything IP-keyed (e.g. the
    # /api/auth/login rate limiter; see apps/api/src/lib/rateLimit.ts and
    # server.ts's trustProxy config, which makes Fastify trust exactly
    # TRUST_PROXY_HOPS proxy-appended hops, default 1 = this nginx, rather
    # than a client-supplied value; set it to 2 when another reverse proxy
    # sits in front of this one — see README "Fronting with TLS").
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Server-Sent Events (live drop status). A regex location, so it takes precedence
  # over the /api/ prefix block above. Buffering is turned off here explicitly (the
  # API also sends X-Accel-Buffering: no) so events are never held back in nginx.
  # The idle limit is proxy_read_timeout (default 60s, which does drop a silent
  # stream); the API writes a heartbeat comment every 25s to stay well inside it.
  location ~ ^/api/links/[^/]+/events$ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    # Same rationale as the /api/ block above — keep IP forwarding consistent
    # across every location that proxies to the API.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Browser-facing proxy for MinIO presigned URLs (MINIO_PUBLIC_ENDPOINT=<origin>/s3).
  # The trailing slash on proxy_pass strips the /s3/ prefix so MinIO sees path-style
  # /<bucket>/<key>. The API signs presigned URLs against the public origin without the
  # /s3 prefix, and SigV4 covers the Host header, so the client's Host (including port —
  # hence $http_host, not $host) must be forwarded unchanged.
  location /s3/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    # Defense in depth only: the real per-upload limit is the Content-Length signed
    # into each presigned PUT (MAX_FILE_SIZE_BYTES + NaCl overhead), which MinIO
    # enforces. nginx can't read runtime env vars here, so this is a static ceiling
    # sized for the 500 MiB default plus margin — raise it if you raise
    # MAX_FILE_SIZE_BYTES above that.
    client_max_body_size 550m;
    proxy_request_buffering off;
    proxy_buffering off;

    # Everything served here is ciphertext the app fetch()es and decrypts
    # in-page; nothing here should ever be rendered or executed by the
    # browser. But presigned PUTs don't sign Content-Type, so an uploader
    # could store an object as text/html or text/javascript and share its
    # (same-origin!) presigned GET URL. So: force a non-renderable type, and
    # send a CSP that sandboxes any document into an opaque origin with no
    # scripts. Because this location declares add_header, the server-level
    # headers are NOT inherited here, hence the full repeat below.
    # No `always` on Content-Type: nginx's own error pages (e.g. 502 when
    # MinIO is down) already carry their own text/html type, and `always`
    # would duplicate the header there. Upstream (MinIO) error responses are
    # left with no Content-Type at all; their bodies are MinIO-generated XML,
    # not uploader-controlled, and the sandbox CSP applies regardless.
    proxy_hide_header Content-Type;
    add_header Content-Type "application/octet-stream";
    add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
